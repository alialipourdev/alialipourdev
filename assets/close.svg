<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title">
  <title id="title">Let's make something meaningful</title>
  <defs>
    <linearGradient id="closeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f0c"/>
      <stop offset="0.5" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#0b0f0c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="22" fill="#0b0f0c"/>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="22" fill="none" stroke="#1d2918"/>
  <rect x="360" y="36" width="480" height="2" fill="url(#closeline)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="92" fill="#f5f5f5" font-size="34" font-weight="700">Let's make something meaningful.</text>
    <text x="600" y="128" fill="#a1a1aa" font-size="16">Thoughtful products. Hard frontend problems. People who care about the details.</text>
    <text x="600" y="172" fill="#a3e635" font-size="12" font-weight="700" letter-spacing="2.2">THINK DIFFERENT   /   BUILD BETTER   /   KEEP CREATING</text>
  </g>
</svg>
