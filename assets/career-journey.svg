<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Ali Alipour Career Journey</title>
<desc id="desc">A neon lime career timeline from Blackstudio in 2024 through Invesweet and freelance work to Rayan Dadeh Noafarin in 2026.</desc>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4d7c0f"/>
    <stop offset=".5" stop-color="#a3e635"/>
    <stop offset="1" stop-color="#d9f99d"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="430" rx="24" fill="#0b0f0c"/>
<text x="60" y="62" fill="#a3e635" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="5">CAREER JOURNEY / 2024—NOW</text>
<text x="60" y="104" fill="#f5f5f5" font-family="Arial,sans-serif" font-size="31" font-weight="700">Four chapters. One continuous journey.</text>
<path d="M105 225 C210 145 285 305 390 225 S570 145 675 225 S855 305 960 225 S1080 165 1100 225" fill="none" stroke="#293329" stroke-width="18" stroke-linecap="round"/>
<path d="M105 225 C210 145 285 305 390 225 S570 145 675 225 S855 305 960 225 S1080 165 1100 225" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
<g font-family="Arial,sans-serif">
  <g transform="translate(105 225)">
    <circle r="17" fill="#a3e635" stroke="#0b0f0c" stroke-width="7"/>
    <text x="0" y="-49" fill="#a3e635" font-size="18" text-anchor="middle" font-weight="700">2024—25</text>
    <text x="0" y="57" fill="#ffffff" font-size="19" text-anchor="middle" font-weight="700">Blackstudio</text>
    <text x="0" y="82" fill="#9ca3af" font-size="14" text-anchor="middle">Frontend Developer</text>
  </g>
  <g transform="translate(390 225)">
    <circle r="17" fill="#a3e635" stroke="#0b0f0c" stroke-width="7"/>
    <text x="0" y="-49" fill="#a3e635" font-size="18" text-anchor="middle" font-weight="700">2025</text>
    <text x="0" y="57" fill="#ffffff" font-size="19" text-anchor="middle" font-weight="700">Invesweet</text>
    <text x="0" y="82" fill="#9ca3af" font-size="14" text-anchor="middle">Frontend Developer</text>
  </g>
  <g transform="translate(675 225)">
    <circle r="17" fill="#a3e635" stroke="#0b0f0c" stroke-width="7"/>
    <text x="0" y="-49" fill="#a3e635" font-size="18" text-anchor="middle" font-weight="700">2025—26</text>
    <text x="0" y="57" fill="#ffffff" font-size="19" text-anchor="middle" font-weight="700">Freelance</text>
    <text x="0" y="82" fill="#9ca3af" font-size="14" text-anchor="middle">Independent Developer</text>
  </g>
  <g transform="translate(960 225)">
    <circle r="19" fill="#d9f99d" stroke="#0b0f0c" stroke-width="7" filter="url(#glow)"/>
    <text x="0" y="-49" fill="#d9f99d" font-size="18" text-anchor="middle" font-weight="700">2026—NOW</text>
    <text x="0" y="57" fill="#ffffff" font-size="19" text-anchor="middle" font-weight="700">Rayan Dadeh</text>
    <text x="0" y="82" fill="#9ca3af" font-size="14" text-anchor="middle">Frontend Developer</text>
  </g>
</g>
<text x="60" y="380" fill="#6b7280" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">DESIGN • ENGINEERING • CONTINUOUS GROWTH</text>
<text x="1140" y="380" fill="#a3e635" font-family="Arial,sans-serif" font-size="13" text-anchor="end">ALI ALIPOUR</text>
</svg>