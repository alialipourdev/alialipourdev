<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="228" viewBox="0 0 1200 228" role="img" aria-labelledby="title">
  <title id="title">Architecture, interface, and craft</title>
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect width="380" height="228" rx="22" fill="#0c100d" stroke="#243024"/>
      <text x="250" y="168" fill="#a3e635" fill-opacity="0.14" font-size="92" font-weight="700">01</text>
      <rect x="28" y="28" width="36" height="4" rx="2" fill="#a3e635"/>
      <text x="28" y="64" fill="#a3e635" font-size="12" font-weight="700" letter-spacing="2.4">ARCHITECTURE</text>
      <text x="28" y="108" fill="#f5f5f5" font-size="26" font-weight="700">Structure</text>
      <text x="28" y="148" fill="#a1a1aa" font-size="15">Systems that stay clear</text>
      <text x="28" y="172" fill="#a1a1aa" font-size="15">as the product grows.</text>
    </g>
    <g>
      <rect x="410" width="380" height="228" rx="22" fill="#0c100d" stroke="#243024"/>
      <text x="660" y="168" fill="#a3e635" fill-opacity="0.14" font-size="92" font-weight="700">02</text>
      <rect x="438" y="28" width="36" height="4" rx="2" fill="#a3e635"/>
      <text x="438" y="64" fill="#a3e635" font-size="12" font-weight="700" letter-spacing="2.4">INTERFACE</text>
      <text x="438" y="108" fill="#f5f5f5" font-size="26" font-weight="700">Surface</text>
      <text x="438" y="148" fill="#a1a1aa" font-size="15">Responsive product UI, RTL,</text>
      <text x="438" y="172" fill="#a1a1aa" font-size="15">built to feel fast.</text>
    </g>
    <g>
      <rect x="820" width="380" height="228" rx="22" fill="#0c100d" stroke="#243024"/>
      <text x="1070" y="168" fill="#a3e635" fill-opacity="0.14" font-size="92" font-weight="700">03</text>
      <rect x="848" y="28" width="36" height="4" rx="2" fill="#a3e635"/>
      <text x="848" y="64" fill="#a3e635" font-size="12" font-weight="700" letter-spacing="2.4">CRAFT</text>
      <text x="848" y="108" fill="#f5f5f5" font-size="26" font-weight="700">Detail</text>
      <text x="848" y="148" fill="#a1a1aa" font-size="15">Typed data, reusable parts,</text>
      <text x="848" y="172" fill="#a1a1aa" font-size="15">and a workflow others trust.</text>
    </g>
  </g>
</svg>
