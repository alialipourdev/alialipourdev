<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="title">
  <title id="title">Architecture, interface, and craft</title>
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="0" y="8" width="380" height="198" rx="20" fill="#0c100d" stroke="#243024"/>
      <rect x="28" y="28" width="36" height="4" rx="2" fill="#a3e635"/>
      <text x="28" y="78" fill="#a3e635" font-size="13" font-weight="700" letter-spacing="2">01</text>
      <text x="28" y="114" fill="#f5f5f5" font-size="24" font-weight="700">Architecture</text>
      <text x="28" y="150" fill="#a1a1aa" font-size="15">Systems that stay clear</text>
      <text x="28" y="174" fill="#a1a1aa" font-size="15">as the product grows.</text>
    </g>
    <g>
      <rect x="410" y="8" width="380" height="198" rx="20" fill="#0c100d" stroke="#243024"/>
      <rect x="438" y="28" width="36" height="4" rx="2" fill="#a3e635"/>
      <text x="438" y="78" fill="#a3e635" font-size="13" font-weight="700" letter-spacing="2">02</text>
      <text x="438" y="114" fill="#f5f5f5" font-size="24" font-weight="700">Interface</text>
      <text x="438" y="150" fill="#a1a1aa" font-size="15">Responsive product UI, RTL,</text>
      <text x="438" y="174" fill="#a1a1aa" font-size="15">built to feel fast.</text>
    </g>
    <g>
      <rect x="820" y="8" width="380" height="198" rx="20" fill="#0c100d" stroke="#243024"/>
      <rect x="848" y="28" width="36" height="4" rx="2" fill="#a3e635"/>
      <text x="848" y="78" fill="#a3e635" font-size="13" font-weight="700" letter-spacing="2">03</text>
      <text x="848" y="114" fill="#f5f5f5" font-size="24" font-weight="700">Craft</text>
      <text x="848" y="150" fill="#a1a1aa" font-size="15">Typed data, reusable parts,</text>
      <text x="848" y="174" fill="#a1a1aa" font-size="15">and a workflow others trust.</text>
    </g>
  </g>
</svg>
