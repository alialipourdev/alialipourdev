name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Clone snake renderer
        run: git clone --depth 1 https://github.com/Platane/snk.git "$RUNNER_TEMP/snk"

      - name: Install snake renderer
        working-directory: ${{ runner.temp }}/snk
        run: bun install

      - name: Generate snakes for 2024, 2025, and 2026
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: alialipourdev
          SNAKE_YEARS: "2024,2025,2026"
          SNK_ROOT: ${{ runner.temp }}/snk
          OUTPUT_DIR: dist
        run: bun .github/scripts/generate-snakes.js

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
